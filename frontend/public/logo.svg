<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Cap & Core Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />

  <!-- Background Decorative Glowing Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="12 16" opacity="0.4" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.2" />

  <!-- Central AI Glowing Orb -->
  <circle cx="256" cy="256" r="140" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)" />

  <!-- AI Brain / Circuit Connections behind Cap -->
  <g stroke="url(#primaryGrad)" stroke-width="4" opacity="0.6" stroke-linecap="round">
    <line x1="256" y1="210" x2="256" y2="150" />
    <line x1="256" y1="210" x2="170" y2="280" />
    <line x1="256" y1="210" x2="342" y2="280" />
    <circle cx="170" cy="280" r="8" fill="#38bdf8" />
    <circle cx="342" cy="280" r="8" fill="#c084fc" />
    <circle cx="256" cy="150" r="10" fill="#f43f5e" />
  </g>

  <!-- Graduation Cap Diamond (Isometric) -->
  <polygon points="256,120 410,195 256,270 102,195" fill="url(#primaryGrad)" filter="url(#glow)" />
  <polygon points="256,135 385,195 256,255 127,195" fill="#1e1b4b" opacity="0.5" />

  <!-- Cap Base / Skullcap -->
  <path d="M 160,228 L 160,290 C 160,335 352,335 352,290 L 352,228" fill="none" stroke="url(#primaryGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 160,228 L 160,290 C 160,335 352,335 352,290 L 352,228" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Tassel & Hanging Bead -->
  <path d="M 400,200 L 420,280 L 420,340" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="420" cy="350" r="14" fill="url(#accentGrad)" filter="url(#glow)" />

  <!-- AI Sparkle 1 (Top Right) -->
  <g transform="translate(370, 100)">
    <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  </g>

  <!-- AI Sparkle 2 (Bottom Left) -->
  <g transform="translate(130, 370) scale(0.65)">
    <path d="M 0,-24 Q 0,0 24,0 Q 0,0 0,24 Q 0,0 -24,0 Q 0,0 0,-24 Z" fill="url(#primaryGrad)" filter="url(#glow)" />
  </g>

  <!-- Open Book Wings Accent (Bottom Center) -->
  <path d="M 180,390 Q 256,365 332,390 Q 256,415 180,390 Z" fill="url(#primaryGrad)" opacity="0.9" filter="url(#glow)" />
  <path d="M 190,390 Q 256,375 322,390" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8" />
</svg>
